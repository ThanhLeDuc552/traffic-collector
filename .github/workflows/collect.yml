name: collect-traffic

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (UTC); main.py decides whether a run is due
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the interval check and collect now"
        type: boolean
        default: false

concurrency:
  group: collect-traffic
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests networkx

      - name: Collect traffic
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          MAX_SEGMENTS: "30"
          FORCE_RUN: ${{ inputs.force && '1' || '0' }}
        run: python main.py

      - name: Commit data
        if: always()
        run: |
          git config user.name "traffic-bot"
          git config user.email "traffic-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git commit -m "traffic data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase
          git push
